# ============================================================
# MkDocs 配置文件 —— MyProject Docs
# 主题: Material for MkDocs | 语言: 中文 | 部署: GitHub Pages（mkdocs gh-deploy 根目录直出）
# ============================================================

# ---------- 站点基础信息 ----------
site_name: Heureka's Blog
site_url: https://fay-liang.github.io/
site_description: Heureka 的牢骚窝
site_author: Heureka
copyright: Copyright &copy; 2026 Heureka

# ---------- 仓库与编辑链接 ----------
repo_url: https://github.com/Fay-Liang   # 右上角按钮：指向 GitHub 个人主页（非仓库）
repo_name: Fay-Liang
edit_uri: https://github.com/Fay-Liang/Fay-Liang.github.io/blob/main/docs/
                                   # 必须用绝对地址：repo_url 已改为主页，
                                   # 相对的 blob/main/docs/ 会拼成无效链接

# ---------- 目录设置 ----------
docs_dir: docs                     # 源目录（默认 docs）
site_dir: site                     # 输出目录（默认 site）
# use_directory_urls: true         # 默认 true：生成目录式 URL（foo/ 而非 foo.html）

# ---------- 主题配置 ----------
theme:
  name: material
  language: zh                     # 简体中文界面
  features:
    - navigation.tabs              # 顶级导航标签页
    - navigation.top               # 回到顶部按钮
    - navigation.expand            # 默认展开侧边栏
    - navigation.instant           # 即时加载（无刷新跳转）
    - navigation.indexes           # 目录页作为索引页
    # - toc.integrate              # 启用后目录并入左侧边栏（右侧不再有目录）
    #                               当前布局：左侧文章列表 + 右侧当前文章目录
    - search.suggest               # 搜索建议
    - search.highlight             # 搜索高亮
    - header.autohide              # 滚动时自动隐藏顶部栏
    - content.code.copy            # 代码块复制按钮
    - content.tabs.link            # 内容标签页联动
  palette:
    - scheme: default              # 浅色模式
      primary: indigo              # 恢复原配色（logo 已加白色底垫，深色顶栏下依然清晰）
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate                # 深色模式
      primary: indigo              # 恢复原配色（logo 已加白色底垫，深色顶栏下依然清晰）
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  font:
    text: Noto Sans SC             # 正文字体
    code: JetBrains Mono           # 等宽字体
  # 导航栏站点名左侧的图标：由顶层 logo 指定图片文件（相对 docs_dir）
  # 注意：Material 模板中 theme.logo 优先于 theme.icon.logo——
  #       只要这里设了图片，下面的 icon.logo 就不会生效
  logo: assets/images/favicon.ico
  icon:
    # logo: material/library        # 被上面的 theme.logo 覆盖，此处已失效
    repo: fontawesome/brands/github
  favicon: assets/images/favicon.ico   # 路径相对 docs_dir，即 docs/assets/images/

# ---------- 导航配置 ----------
nav:
  - 首页: index.md
  - 学习笔记:
      - 51单片机: 学习笔记/51单片机.md
      - STM32: 学习笔记/STM32.md
      - ESP32: 学习笔记/ESP32.md
      - Linux: 学习笔记/Linux.md
  - 教程文档:
      - SDCC使用指南: 教程文档/SDCC使用指南.md
      - Ubuntu开机亮度无法自动调节: 教程文档/Ubuntu开机亮度无法自动调节.md
  - 项目开发:
      - 六足机器人: 项目开发/六足机器人.md
      - 可自主预警的天气小助手: 项目开发/可自主预警的天气小助手.md
  - 参赛笔记:
      - 蓝桥杯单片机: 参赛笔记/蓝桥杯.md
  - 关于: 关于.md

# ---------- Markdown 扩展 ----------
markdown_extensions:
  # 内置扩展
  - toc:                           # 目录生成
      permalink: true              # 标题锚点链接
      toc_depth: 3                 # 目录深度 1-3 级
  - tables                         # 表格
  - admonition                     # 提示框（!!! note / warning / danger）
  - footnotes                      # 脚注
  - attr_list                      # HTML 属性（图片尺寸、对齐）
  - def_list                       # 定义列表
  - meta                           # 页面元信息（YAML front matter）
  - md_in_html                     # HTML 内嵌 Markdown
  - sane_lists                     # 严格列表解析
  - smarty                         # 智能引号、破折号
  - abbr                           # 缩写
  # Pymdown Extensions
  - pymdownx.highlight:            # 代码高亮
      anchor_linenums: true        # 行号锚点
      linenums: true               # 显示行号
  - pymdownx.superfences:          # 增强围栏代码块，支持 Mermaid
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite          # 行内代码高亮
  - pymdownx.snippets              # 从外部文件插入代码片段
  - pymdownx.tabbed:               # 标签页内容
      alternate_style: true
  - pymdownx.details               # 折叠块（??? 可折叠提示）
  - pymdownx.tasklist:             # 任务列表 [x]
  - pymdownx.emoji:                # Emoji
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:           # LaTeX 数学公式
      generic: true
  - pymdownx.keys                  # 键盘按键样式
  - pymdownx.magiclink             # 自动识别 URL 为链接
  - pymdownx.caret                 # ^上标^
  - pymdownx.tilde                 # ~~删除线~~
  - pymdownx.mark                  # ==高亮==
  - pymdownx.smartsymbols          # 智能符号（--> 箭头）

# ---------- 插件 ----------
plugins:
  - search:                        # 搜索（声明 plugins 后须显式加入）
      lang:
        - zh                       # 中文分词搜索
      separator: '[\s\u200b\-]'
  - git-revision-date-localized:   # 页面最后修改时间
      type: datetime
      locale: zh
      fallback_to_build_date: true # 非 git 仓库/无历史时回退为构建日期
  - minify:                        # 压缩产物
      minify_html: true
      minify_css: true
      minify_js: true

# ---------- 自定义资源 ----------
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Fay-Liang

extra_css:
  - assets/css/extra.css           # 追加自定义样式

extra_javascript:
  - assets/js/mathjax.js           # MathJax 配置（必须先于 CDN 脚本加载）
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js

# ---------- 构建与开发行为 ----------
strict: true                       # 有警告即构建失败（CI 中强烈建议）
dev_addr: 127.0.0.1:8000           # 开发服务器地址
validation:                        # 链接与锚点校验级别（strict 模式下警告即失败）
  links:
    not_found: warn                # 死链接警告（strict 下视为错误）
    anchors: warn                  # 无效锚点警告
    absolute_links: warn           # 绝对链接警告
  nav:
    omitted_files: info            # 未出现在 nav 中的文件：仅提示，不中断构建
                                   # （邮箱.md / 友链.md 已从 nav 移除但保留文件，
                                   #   设 warn 会在 strict 下直接构建失败）
    not_found: warn

# ---------- 部署相关 ----------
remote_branch: gh-pages            # gh-deploy 目标分支
remote_name: origin                # 远程仓库名